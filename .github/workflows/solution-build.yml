# This workflow will build a .NET project
name: DIFC Backend Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore DIFC-Backend/DIFC.slnx

    - name: Build Solution
      run: dotnet build DIFC-Backend/DIFC.slnx --configuration Release --no-restore


